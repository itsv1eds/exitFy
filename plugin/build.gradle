tasks.register("lintPluginTemplate") {
    group = "verification"
    dependsOn "validateEmbeddedDexConfig"
    doLast {
        providers.exec {
            commandLine "python3", "-c",
                    "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), filename=sys.argv[1], feature_version=(3,11))",
                    pluginTemplateFile.absolutePath
        }.result.get().assertNormalExitValue()
    }
}

tasks.register("verifySettingsReachTheRuntime") {
    group = "verification"
    description = "Every setting the runtime reads must be one the template sends"
    def settingsFile = file("src/main/java/com/extera/plugins/exitfy/SettingsModel.java")
    inputs.files(settingsFile, pluginTemplateFile)
    outputs.upToDateWhen { false }
    doLast {
        // A setting the template leaves out is read back as its default on the
        // next start, so it looks like the plugin forgot it. This has happened
        // twice; the contract is checked instead of remembered.
        String model = settingsFile.text
        int parseStart = model.indexOf("static SettingsModel fromJson")
        int parseEnd = model.indexOf("JSONObject toJson")
        if (parseStart < 0 || parseEnd < parseStart) {
            throw new GradleException("Cannot locate the settings parser")
        }
        String parser = model.substring(parseStart, parseEnd)
        String template = pluginTemplateFile.getText("UTF-8")
        int sendStart = template.indexOf("    def _settings_dict(self):")
        int sendEnd = template.indexOf("\n    def ", sendStart + 1)
        if (sendStart < 0 || sendEnd < sendStart) {
            throw new GradleException("Cannot locate the template settings payload")
        }
        String sent = template.substring(sendStart, sendEnd)
        List<String> missing = []
        (parser =~ /object\.opt\w+\("([a-z_]+)"/).each { match ->
            String key = match[1]
            if (!sent.contains("\"${key}\":")) missing.add(key)
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Settings the template never sends: " + missing.join(", "))
        }
    }
}

tasks.register("verifyFailoverStaysOptIn") {
    group = "verification"
    description = "Server switching must never start without the user asking for it"
    def settingsFile = file("src/main/java/com/extera/plugins/exitfy/SettingsModel.java")
    def coordinatorFile = file(
            "src/main/java/com/extera/plugins/exitfy/RuntimeCoordinator.java")
    inputs.files(settingsFile, coordinatorFile)
    outputs.upToDateWhen { false }
    doLast {
        String settingsText = settingsFile.text
        if (!settingsText.contains('object.optBoolean("failover", false)')) {
            throw new GradleException("Stored failover must default to off")
        }
        if (!settingsText.contains(
                "this(enabled, providerId, customHwid, schemaVersion, pingType, false, false);")) {
            throw new GradleException("Settings built without the flags must leave them off")
        }
        String coordinatorText = coordinatorFile.text
        if (!coordinatorText.contains("if (!settings.failover")) {
            throw new GradleException("Server rotation must be gated by the stored setting")
        }
    }
}

tasks.register("verifyManifestSigningKey") {
    group = "verification"
    description = "Keeps the embedded manifest key equal to the key the release pipeline signs with"
    def updaterFile = file("src/main/java/com/extera/plugins/exitfy/CoreUpdater.java")
    def publicKeyFile = rootProject.file("../cores/scripts/core_signing_key.pub")
    inputs.files(updaterFile, publicKeyFile)
    outputs.upToDateWhen { false }
    doLast {
        if (!publicKeyFile.isFile()) {
            throw new GradleException("Release signing key is missing: ${publicKeyFile}")
        }
        def matcher = updaterFile.text =~ /(?s)MANIFEST_PUBLIC_KEY\s*=\s*(.*?);/
        if (!matcher.find()) throw new GradleException("MANIFEST_PUBLIC_KEY declaration not found")
        // The constant is a concatenation of literals, and '+' is both the
        // Java operator and a base64 character, so only quoted spans count.
        def embedded = (matcher.group(1) =~ /"([^"]*)"/).collect { it[1] }.join("")
        def published = publicKeyFile.text
                .replaceAll(/-----[^-]*-----/, "")
                .replaceAll(/\s+/, "")
        if (embedded != published) {
            throw new GradleException(
                    "Embedded manifest key differs from cores/scripts/core_signing_key.pub; "
                            + "signed releases would be refused on every device")
        }
    }
}

tasks.matching { it.name == "lintPlugin" }.configureEach {
    dependsOn tasks.named("lintPluginTemplate")
    dependsOn tasks.named("verifyManifestSigningKey")
    dependsOn tasks.named("verifyFailoverStaysOptIn")
    dependsOn tasks.named("verifySettingsReachTheRuntime")
}

tasks.register("pythonTemplateTests") {
    group = "verification"
    description = "Runs Python-side loader and command-envelope regression tests"
    inputs.files(fileTree("tests").matching { include "test_*.py" }, pluginTemplateFile)
    doLast {
        providers.exec {
            environment "PYTHONDONTWRITEBYTECODE", "1"
            commandLine "python3", "-m", "unittest", "discover",
                    "-s", file("tests").absolutePath, "-p", "test_*.py"
        }.result.get().assertNormalExitValue()
    }
}

tasks.register("unitTests") {
    group = "verification"
    description = "Runs exitFy Java unit tests"
    dependsOn "testDebugUnitTest", "pythonTemplateTests"
}

tasks.register("buildDex") {
    group = "build"
    dependsOn "lintPlugin", "assemblePlugin", "prepareHostClasses"

    doLast {
        File androidJar = file("${androidSdkDir}/platforms/android-${compileSdkApi}/android.jar")
        if (!androidJar.exists()) throw new GradleException("Missing android.jar: ${androidJar}")
        String d8Name = System.getProperty("os.name").toLowerCase().contains("windows") ? "d8.bat" : "d8"
        String d8Path = resolveBuildToolsExe(d8Name)
        File aarFile = layout.buildDirectory.file("outputs/aar/${outputAarName}").get().asFile
        if (!aarFile.exists()) throw new GradleException("Plugin AAR not found: ${aarFile}")

        File jarDir = layout.buildDirectory.dir("dex-input").get().asFile
        delete jarDir
        copy {
            from zipTree(aarFile)
            include "classes.jar"
            into jarDir
        }
        File jarFile = new File(jarDir, "classes.jar")
        File dexDir = layout.buildDirectory.dir("dex").get().asFile
        delete dexDir
        dexDir.mkdirs()
        File exteraHookAar = configurations.pluginCompileClasspath.files.find {
            it.isFile() && it.name == "exterahook-0.2.2.aar"
        }
        if (exteraHookAar == null) {
            throw new GradleException("exterahook 0.2.2 is missing from the D8 classpath")
        }
        File hookClasspathDir = layout.buildDirectory.dir("dex-hook-classpath").get().asFile
        delete hookClasspathDir
        copy {
            from zipTree(exteraHookAar)
            include "classes.jar"
            rename { "exterahook-0.2.2.jar" }
            into hookClasspathDir
        }
        File exteraHookJar = new File(hookClasspathDir, "exterahook-0.2.2.jar")
        if (!exteraHookJar.isFile()) {
            throw new GradleException("classes.jar is missing from ${exteraHookAar}")
        }
        providers.exec {
            commandLine d8Path,
                    "--lib", androidJar.absolutePath,
                    "--classpath", hostClassesJar.absolutePath,
                    "--classpath", exteraHookJar.absolutePath,
                    "--release", "--min-api", minAndroidApi.toString(),
                    "--output", dexDir.absolutePath,
                    jarFile.absolutePath
        }.result.get().assertNormalExitValue()
        File dexFile = new File(dexDir, "classes.dex")
        if (!dexFile.exists()) throw new GradleException("classes.dex was not produced")
        def dexOutputs = fileTree(dexDir).matching { include "classes*.dex" }.files
        if (dexOutputs.size() != 1 || dexOutputs.first().name != "classes.dex") {
            throw new GradleException("Embedded plugin must produce exactly one classes.dex: "
                    + dexOutputs.collect { it.name }.sort().join(", "))
        }

        String generated = pluginTemplateFile.getText("UTF-8")
        generated = replacePayloadBlock(generated, dexBeginMarker, dexEndMarker,
                deflate(dexFile.bytes).encodeBase64().toString())
        generated = replacePayloadBlock(generated, nativeBeginMarker, nativeEndMarker,
                readNativeBundleFromAar(aarFile))

        outputPlugin.parentFile.mkdirs()
        File staged = new File(outputPlugin.parentFile, ".${outputPlugin.name}.tmp")
        staged.setText(generated, "UTF-8")
        Files.move(staged.toPath(), outputPlugin.toPath(),
                StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
        logger.lifecycle("Wrote ${outputPlugin}")
    }
}

tasks.register("auditDexWithJadx") {
    group = "verification"
    description = "Decompiles the final DEX and audits the human-readable output"
    dependsOn "buildDex"
    doLast {
        File dexFile = layout.buildDirectory.file("dex/classes.dex").get().asFile
        if (!dexFile.isFile()) throw new GradleException("classes.dex is missing for JADX audit")
        File auditDir = layout.buildDirectory.dir("jadx-audit").get().asFile
        delete auditDir
        auditDir.mkdirs()
        providers.exec {
            commandLine resolveJadx(), "--no-res", "--no-imports",
                    "--comments-level", "none", "--log-level", "error",
                    "--decompilation-mode", "fallback",
                    "-d", auditDir.absolutePath, dexFile.absolutePath
        }.result.get().assertNormalExitValue()

        File sourceRoot = new File(auditDir, "sources")
        def sources = sourceRoot.isDirectory()
                ? fileTree(sourceRoot).matching { include "**/*.java" }.files
                : [] as Set
        if (sources.isEmpty()) throw new GradleException("JADX produced no Java sources")
        File bridgeSource = new File(sourceRoot,
                "com/extera/plugins/exitfy/ExitFyBridge.java")
        if (!bridgeSource.isFile()) throw new GradleException("JADX did not recover ExitFyBridge")
        sources.each { source ->
            String lower = source.getText("UTF-8").toLowerCase(Locale.ROOT)
            if (lower.contains("jadx error")) {
                throw new GradleException("JADX reported broken decompilation in ${source}")
            }
            forbiddenLocalArtifactTokens.each { token ->
                if (lower.contains(token)) {
                    throw new GradleException("Local source path leaked into JADX output: ${source}")
                }
            }
            forbiddenSensitiveSubscriptionTokens.each { token ->
                if (lower.contains(token)) {
                    throw new GradleException(
                            "Plaintext built-in subscription material remains in JADX output: ${source}")
                }
            }
        }
        assertNoProviderPlaintext(sources,
                providerSecretNeedles(privateProviderUrls()), "JADX output")
        logger.lifecycle("JADX-audited ${sources.size()} exitFy classes")
    }
}

tasks.register("verifyPluginArtifact") {
    group = "verification"
    dependsOn "buildDex", "auditDexWithJadx", "unitTests", "assembleDebugAndroidTest"
    doLast {
        def heapDumps = fileTree(projectDir).matching { include "java_pid*.hprof" }.files
        if (!heapDumps.isEmpty()) {
            throw new GradleException("Heap dump must not remain in the plugin project")
        }
        String text = outputPlugin.getText("UTF-8")
        [
                "__id__ = \"${pluginId}\"",
                "__version__ = \"${pluginVersion}\"",
                "__author__ = \"${pluginAuthor}\"",
                "__icon__ = \"${pluginIcon}\"",
                "__app_version__ = \">=12.5.1\"",
                "__sdk_version__ = \">=1.4.3.3\"",
        ].each { metadata ->
            if (!text.contains(metadata)) throw new GradleException("Generated metadata is invalid: ${metadata}")
        }
        File mergedPluginManifest = file(
                "build/intermediates/merged_manifest/plugin/processPluginManifest/AndroidManifest.xml")
        if (!mergedPluginManifest.isFile()
                || !mergedPluginManifest.getText("UTF-8").contains(
                "android:minSdkVersion=\"${minAndroidApi}\"")) {
            throw new GradleException("Plugin manifest minSdk is not API ${minAndroidApi}")
        }
        byte[] dex = inflate(payloadFromBlock(text, dexBeginMarker, dexEndMarker).decodeBase64())
        if (dex.length < 8 || new String(dex, 0, 4, StandardCharsets.US_ASCII) != "dex\n") {
            throw new GradleException("Embedded DEX magic is invalid")
        }
        if (!new String(dex, StandardCharsets.ISO_8859_1).contains("Lcom/extera/plugins/exitfy/ExitFyBridge;")) {
            throw new GradleException("Embedded DEX entry class is missing")
        }
        File builtDex = layout.buildDirectory.file("dex/classes.dex").get().asFile
        if (!builtDex.isFile() || sha256(dex) != sha256(builtDex.bytes)) {
            throw new GradleException("Embedded DEX digest does not match the built DEX")
        }
        def dexOutputs = fileTree(builtDex.parentFile)
                .matching { include "classes*.dex" }.files
        if (dexOutputs.size() != 1 || dexOutputs.first().name != "classes.dex") {
            throw new GradleException("Unexpected multidex output: "
                    + dexOutputs.collect { it.name }.sort().join(", "))
        }
        String dexdumpName = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ?
                "dexdump.exe" : "dexdump"
        String dexDump = captureCommand([resolveBuildToolsExe(dexdumpName), "-f", builtDex.absolutePath])
        Set<String> definedClasses = new LinkedHashSet<>()
        def descriptorMatcher = dexDump =~ /(?m)^\s*Class descriptor\s*:\s*'([^']+)'\s*$/
        while (descriptorMatcher.find()) {
            definedClasses.add(descriptorMatcher.group(1))
        }
        if (definedClasses.isEmpty()) {
            throw new GradleException("dexdump did not report any defined classes")
        }
        def foreignClasses = definedClasses.findAll {
            !it.startsWith("Lcom/extera/plugins/exitfy/")
        }
        if (!foreignClasses.isEmpty()) {
            throw new GradleException("Embedded DEX defines classes outside the plugin namespace: "
                    + foreignClasses.take(10).join(", "))
        }
        String bridgeDescriptor = "Lcom/extera/plugins/exitfy/ExitFyBridge;"
        int bridgeStart = dexDump.indexOf("Class descriptor  : '${bridgeDescriptor}'")
        int bridgeEnd = bridgeStart < 0 ? -1 : dexDump.indexOf("\nClass #", bridgeStart + 1)
        if (bridgeStart < 0) throw new GradleException("ExitFyBridge class is absent from dexdump")
        if (bridgeEnd < 0) bridgeEnd = dexDump.length()
        String bridgeBlock = dexDump.substring(bridgeStart, bridgeEnd)
        int directMethodsStart = bridgeBlock.indexOf("Direct methods")
        int virtualMethodsStart = bridgeBlock.indexOf("Virtual methods", directMethodsStart + 1)
        if (directMethodsStart < 0 || virtualMethodsStart < 0) {
            throw new GradleException("Cannot locate ExitFyBridge method table")
        }
        String bridgeMethodsBlock = bridgeBlock.substring(directMethodsStart, virtualMethodsStart)
        Set<String> actualPublicStaticBridgeMethods = new LinkedHashSet<>()
        def bridgeMethodMatcher = bridgeMethodsBlock =~ /(?ms)^\s+name\s+:\s+'([^']+)'\s*$\s*^\s+type\s+:\s+'([^']+)'\s*$\s*^\s+access\s+:\s+0x[0-9a-f]+\s+\(([^)]*)\)\s*$/
        while (bridgeMethodMatcher.find()) {
            String flags = bridgeMethodMatcher.group(3)
            if (flags.contains("PUBLIC") && flags.contains("STATIC")) {
                actualPublicStaticBridgeMethods.add(
                        bridgeMethodMatcher.group(1) + bridgeMethodMatcher.group(2))
            }
        }
        Set<String> expectedPublicStaticBridgeMethods = [
                "configure(Ljava/lang/String;)V",
                "load()V",
                "unload()V",
                "updateSettings(Ljava/lang/String;)V",
                "execute(Ljava/lang/String;)Ljava/lang/String;",
                "getUiState()Ljava/lang/String;",
                "onAppResume()V",
        ] as Set
        if (actualPublicStaticBridgeMethods != expectedPublicStaticBridgeMethods) {
            throw new GradleException("Public static bridge ABI mismatch. Expected "
                    + expectedPublicStaticBridgeMethods + ", got "
                    + actualPublicStaticBridgeMethods)
        }
        def dashboardFactoryMatcher = bridgeMethodsBlock =~ /(?ms)^\s+name\s+:\s+'createDashboardFragment'\s*$\s*^\s+type\s+:\s+'\(\)Lorg\/telegram\/ui\/ActionBar\/BaseFragment;'\s*$\s*^\s+access\s+:\s+0x[0-9a-f]+\s+\(([^)]*)\)\s*$/
        if (!dashboardFactoryMatcher.find()) {
            throw new GradleException("Package-private dashboard factory is absent from bridge")
        }
        String dashboardFactoryFlags = dashboardFactoryMatcher.group(1)
        if (!dashboardFactoryFlags.contains("STATIC")
                || dashboardFactoryFlags.contains("PUBLIC")) {
            throw new GradleException(
                    "Dashboard factory must remain package-private and outside public bridge ABI")
        }
        String proxyControllerDescriptor =
                "Lcom/exteragram/messenger/proxy/ProxyController;"
        if (new String(dex, StandardCharsets.ISO_8859_1)
                .contains(proxyControllerDescriptor)) {
            throw new GradleException(
                    "Embedded DEX has a static ProxyController type reference")
        }
        String forbiddenProtocol = ["tg", "ws"].join("")
        String forbiddenDashed = ["tg", "-ws"].join("")
        String dexText = new String(dex, StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
        ["landroidx/compose/", "lcom/google/android/material/", "composeview"].each { token ->
            if (dexText.contains(token)) {
                throw new GradleException("Forbidden UI runtime remains in decoded DEX: ${token}")
            }
        }
        if (dexText.contains("exitfyviews")
                || dexText.contains("exitfynativeui")
                || dexText.contains("exitfyui")
                || dexText.contains("universalfragment")
                || dexText.contains("android/graphics/path;")) {
            throw new GradleException("Obsolete or unsupported UI remains in decoded DEX")
        }
        if (!dexText.contains("createDashboardFragment".toLowerCase(Locale.ROOT))
                || !dexText.contains("lorg/telegram/ui/actionbar/basefragment;")) {
            throw new GradleException("Telegram-native dashboard is missing from decoded DEX")
        }
        if (!dexText.contains(
                "lcom/exteragram/messenger/plugins/pythonpluginsengine;")
                || !dexText.contains("openpluginsettings")
                || !dexText.contains("exitfy_v2")
                || !dexText.contains("lde/robv/android/xposed/xposedbridge;")) {
            throw new GradleException("Direct plugin-settings hook is missing from decoded DEX")
        }
        forbiddenAndroidRuntimeAbiTokens.each { token ->
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException(
                        "Removed Android ABI remains in generated artifact: ${token}")
            }
        }
        forbiddenLocalArtifactTokens.each { token ->
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException("Local source path leaked into generated plugin")
            }
        }
        if (dexText.contains(forbiddenProtocol) || dexText.contains(forbiddenDashed)) {
            throw new GradleException("Removed transport remains in decoded DEX")
        }
        if (text.toLowerCase(Locale.ROOT).contains(forbiddenProtocol)
                || text.toLowerCase(Locale.ROOT).contains(forbiddenDashed)) {
            throw new GradleException("Removed transport remains in generated plugin")
        }
        forbiddenResetTokens.each { removed ->
            String token = removed.toLowerCase(Locale.ROOT)
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException("Removed settings reset path remains in artifact: ${removed}")
            }
        }
        forbiddenThirdPartyCoreTokens.each { removed ->
            String token = removed.toLowerCase(Locale.ROOT)
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException("Removed third-party core source remains in artifact")
            }
        }
        forbiddenRemovedProviderTokens.each { removed ->
            if (dexText.contains(removed) || text.toLowerCase(Locale.ROOT).contains(removed)) {
                throw new GradleException("Removed provider remains in artifact")
            }
        }
        forbiddenSensitiveSubscriptionTokens.each { token ->
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException(
                        "Plaintext built-in subscription material remains in artifact")
            }
        }
        for (String className : ["ProviderCatalog", "ProviderCatalogData",
                                 "CatalogMaterialA", "CatalogMaterialB"]) {
            if (dexText.contains(className.toLowerCase(Locale.ROOT))) {
                throw new GradleException("Provider material class was not obfuscated: ${className}")
            }
        }
        File mappingFile = layout.buildDirectory.file(
                "outputs/mapping/plugin/mapping.txt").get().asFile
        File minifiedJar = layout.buildDirectory.file("dex-input/classes.jar").get().asFile
        if (!mappingFile.isFile() || !minifiedJar.isFile()) {
            throw new GradleException("R8 mapping or minified classes.jar is missing")
        }
        String mappingText = mappingFile.getText("UTF-8")
        def catalogClassMatch = mappingText =~
                /(?m)^com\.extera\.plugins\.exitfy\.ProviderCatalog -> ([^:]+):$/
        if (!catalogClassMatch.find()) {
            throw new GradleException("R8 mapping does not contain the provider catalog")
        }
        String catalogClassName = catalogClassMatch.group(1)
        int catalogBlockStart = catalogClassMatch.end()
        int catalogBlockEnd = mappingText.indexOf("\ncom.", catalogBlockStart)
        if (catalogBlockEnd < 0) catalogBlockEnd = mappingText.length()
        String catalogBlock = mappingText.substring(catalogBlockStart, catalogBlockEnd)
        def endpointMethodMatch = catalogBlock =~
                /(?m)^\s+(?:\d+:\d+:)?java\.lang\.String endpoint\(int\)(?::\d+:\d+)? -> (\S+)$/
        if (!endpointMethodMatch.find()) {
            throw new GradleException("R8 mapping does not contain the endpoint decoder")
        }
        String endpointMethodName = endpointMethodMatch.group(1)
        def sizeMethodMatch = catalogBlock =~
                /(?m)^\s+(?:\d+:\d+:)?int size\(\)(?::\d+:\d+)? -> (\S+)$/
        def enabledMethodMatch = catalogBlock =~
                /(?m)^\s+(?:\d+:\d+:)?boolean isEnabled\(int\)(?::\d+:\d+)? -> (\S+)$/
        if (!sizeMethodMatch.find() || !enabledMethodMatch.find()) {
            throw new GradleException("R8 mapping does not contain the provider catalog shape")
        }
        String sizeMethodName = sizeMethodMatch.group(1)
        String enabledMethodName = enabledMethodMatch.group(1)
        List<String> decodedEndpoints = new ArrayList<>()
        URLClassLoader catalogLoader = new URLClassLoader(
                [minifiedJar.toURI().toURL()] as URL[], ClassLoader.getPlatformClassLoader())
        try {
            Class<?> catalogClass = Class.forName(catalogClassName, true, catalogLoader)
            java.lang.reflect.Method endpointMethod = catalogClass.getDeclaredMethod(
                    endpointMethodName, Integer.TYPE)
            java.lang.reflect.Method sizeMethod = catalogClass.getDeclaredMethod(sizeMethodName)
            java.lang.reflect.Method enabledMethod = catalogClass.getDeclaredMethod(
                    enabledMethodName, Integer.TYPE)
            endpointMethod.setAccessible(true)
            sizeMethod.setAccessible(true)
            enabledMethod.setAccessible(true)
            Object rawSize = sizeMethod.invoke(null)
            if (!(rawSize instanceof Number)
                    || ((Number) rawSize).intValue() != providerSlotCount) {
                throw new GradleException("R8-obfuscated provider catalog has an invalid slot count")
            }
            for (int index = 0; index < providerSlotCount; index++) {
                Object rawEnabled = enabledMethod.invoke(null, index)
                if (!(rawEnabled instanceof Boolean)) {
                    throw new GradleException("R8-obfuscated provider state is invalid")
                }
                if (!((Boolean) rawEnabled)) continue
                Object decoded = endpointMethod.invoke(null, index)
                if (!(decoded instanceof String)) {
                    throw new GradleException(
                            "R8-obfuscated provider catalog failed its runtime integrity check")
                }
                byte[] encoded = decoded.getBytes(StandardCharsets.UTF_8)
                URI parsed = new URI(decoded)
                if (encoded.length == 0 || encoded.length > 4096
                        || !"https".equalsIgnoreCase(parsed.scheme)
                        || parsed.host == null || parsed.host.isEmpty()
                        || parsed.rawUserInfo != null || parsed.rawFragment != null
                        || decodedEndpoints.contains(decoded)) {
                    throw new GradleException(
                            "R8-obfuscated provider catalog returned an invalid endpoint")
                }
                decodedEndpoints.add((String) decoded)
            }
        } finally {
            catalogLoader.close()
        }
        List<String> configuredProviderUrls = privateProviderUrls() as List<String>
        if (providerPrivateFile.isFile() && decodedEndpoints != configuredProviderUrls) {
            throw new GradleException(
                    "R8-obfuscated provider catalog does not match providers.private.json")
        }
        Set<String> decodedProviderNeedles = providerSecretNeedles(decodedEndpoints)
        decodedProviderNeedles.each { needle ->
            if (dexText.contains(needle) || text.toLowerCase(Locale.ROOT).contains(needle)) {
                throw new GradleException(
                        "Plaintext private provider material remains in generated artifact")
            }
        }
        File jadxSourceRoot = layout.buildDirectory.dir("jadx-audit/sources").get().asFile
        Collection<File> jadxSources = jadxSourceRoot.isDirectory()
                ? fileTree(jadxSourceRoot).matching { include "**/*.java" }.files
                : [] as Set
        assertNoProviderPlaintext(jadxSources, decodedProviderNeedles, "JADX output")
        Collection<File> decodedSourceFiles = new ArrayList<>()
        [file("src/main"), file("src/test"), file("src/androidTest"), file("tests"),
         file("tools")].each { sourceRoot ->
            if (sourceRoot.isDirectory()) decodedSourceFiles.addAll(fileTree(sourceRoot).files)
        }
        decodedSourceFiles.addAll([pluginTemplateFile, file("build.gradle"), proguardFile,
                                   file("README.md"), file("DEVICE_BETA_CHECKLIST.md")])
        assertNoProviderPlaintext(decodedSourceFiles, decodedProviderNeedles, "project sources")
        forbiddenDiagnosticsTokens.each { removed ->
            if (dexText.contains(removed) || text.toLowerCase(Locale.ROOT).contains(removed)) {
                throw new GradleException(
                        "Removed diagnostics surface remains in artifact: ${removed}")
            }
        }
        forbiddenNodeSelectionTokens.each { removed ->
            String token = removed.toLowerCase(Locale.ROOT)
            if (dexText.contains(token) || text.toLowerCase(Locale.ROOT).contains(token)) {
                throw new GradleException(
                        "Removed node-selection feature remains in artifact")
            }
        }
        if (dexText.contains("deleterecursively")) {
            throw new GradleException("Generic recursive data deletion leaked into the plugin DEX")
        }

        byte[] bundleJson = inflate(payloadFromBlock(text, nativeBeginMarker, nativeEndMarker).decodeBase64())
        Map bundle = (Map) new JsonSlurper().parseText(new String(bundleJson, StandardCharsets.UTF_8))
        if ((bundle.format as int) != 1 || bundle.version != pluginVersion) {
            throw new GradleException("Native bundle metadata is invalid")
        }
        if (((Map) bundle.libs).keySet() as Set != supportedAbis as Set) {
            throw new GradleException("Native bundle contains an unexpected ABI set")
        }
        Map expectedMachines = ["arm64-v8a": 183]
        Map expectedElfClasses = ["arm64-v8a": 2]
        List<String> requiredJniExports = [
                "Java_com_extera_plugins_exitfy_NativeBridge_nativeOpen",
                "Java_com_extera_plugins_exitfy_NativeBridge_nativeLoadedIdentity",
                "Java_com_extera_plugins_exitfy_NativeBridge_nativeLoadedCoreApi",
                "Java_com_extera_plugins_exitfy_NativeBridge_nativeStart",
                "Java_com_extera_plugins_exitfy_NativeBridge_nativeStop",
        ]
        Set<String> expectedJniExports = requiredJniExports as Set
        String llvmNm = resolveNdkTool("llvm-nm")
        String llvmReadelf = resolveNdkTool("llvm-readelf")
        File nativeVerifyDir = layout.buildDirectory.dir("verified-native").get().asFile
        delete nativeVerifyDir
        nativeVerifyDir.mkdirs()
        supportedAbis.each { abi ->
            Map item = (Map) ((Map) bundle.libs)[abi]
            if (item == null) throw new GradleException("Bundle ABI missing: ${abi}")
            byte[] so = item.data.toString().decodeBase64()
            if (so.length != (item.size as int) || sha256(so) != item.sha256) {
                throw new GradleException("Bundle digest mismatch: ${abi}")
            }
            if (so.length < 20 || so[0] != 0x7f || so[1] != (byte) 'E' || so[2] != (byte) 'L' || so[3] != (byte) 'F') {
                throw new GradleException("Invalid ELF header: ${abi}")
            }
            int elfClass = so[4] & 0xff
            int elfData = so[5] & 0xff
            if (elfClass != expectedElfClasses[abi] || elfData != 1) {
                throw new GradleException("Wrong ELF class/data encoding for ${abi}: ${elfClass}/${elfData}")
            }
            int machine = (so[18] & 0xff) | ((so[19] & 0xff) << 8)
            if (machine != expectedMachines[abi]) throw new GradleException("Wrong ELF machine for ${abi}: ${machine}")

            File soFile = new File(nativeVerifyDir, "${abi}/libexitfy_bridge.so")
            soFile.parentFile.mkdirs()
            Files.write(soFile.toPath(), so)
            String dynamicSymbols = captureCommand([
                    llvmNm, "-D", "--defined-only", soFile.absolutePath
            ])
            Set<String> exportedNames = dynamicSymbols.readLines()
                    .collect { it.trim().tokenize() }
                    .findAll { !it.isEmpty() }
                    .collect { it.last() } as Set
            if (exportedNames != expectedJniExports) {
                throw new GradleException("JNI export set mismatch for ${abi}. Expected "
                        + expectedJniExports + ", got " + exportedNames)
            }
            String nativeText = new String(so, StandardCharsets.ISO_8859_1)
                    .toLowerCase(Locale.ROOT)
            forbiddenLocalArtifactTokens.each { token ->
                if (nativeText.contains(token)) {
                    throw new GradleException("Local source path leaked into JNI bridge: ${abi}")
                }
            }

            String programHeaders = captureCommand([llvmReadelf, "-lW", soFile.absolutePath])
            def loadHeaders = programHeaders.readLines().findAll {
                it.trim().startsWith("LOAD ")
            }
            if (loadHeaders.isEmpty()) {
                throw new GradleException("ELF has no PT_LOAD segments: ${abi}")
            }
            loadHeaders.each { header ->
                def fields = header.trim().tokenize()
                if (fields.size() < 8) {
                    throw new GradleException("Cannot parse ELF PT_LOAD header for ${abi}: ${header}")
                }
                String offsetText = fields[1]
                String virtualAddressText = fields[2]
                String alignmentText = fields.last()
                long alignment = alignmentText.startsWith("0x") ?
                        Long.parseUnsignedLong(alignmentText.substring(2), 16) :
                        Long.parseLong(alignmentText)
                if (alignment < 16 * 1024) {
                    throw new GradleException("ELF PT_LOAD alignment is below 16 KiB for ${abi}: ${alignmentText}")
                }
                long offset = offsetText.startsWith("0x") ?
                        Long.parseUnsignedLong(offsetText.substring(2), 16) :
                        Long.parseLong(offsetText)
                long virtualAddress = virtualAddressText.startsWith("0x") ?
                        Long.parseUnsignedLong(virtualAddressText.substring(2), 16) :
                        Long.parseLong(virtualAddressText)
                if (Math.floorMod(offset - virtualAddress, alignment) != 0L) {
                    throw new GradleException("ELF PT_LOAD offset/vaddr are not congruent for ${abi}: ${header}")
                }
            }
        }

        File androidTestDir = layout.buildDirectory.dir("outputs/apk/androidTest/debug").get().asFile
        def androidTestApks = androidTestDir.isDirectory() ?
                fileTree(androidTestDir).matching { include "*.apk" }.files : [] as Set
        if (androidTestApks.isEmpty()) {
            throw new GradleException("Debug androidTest APK was not produced")
        }
        androidTestApks.each { apk ->
            ZipFile testZip = new ZipFile(apk)
            boolean sawTestDex = false
            Set<String> packagedAndroidAbis = new LinkedHashSet<>()
            try {
                testZip.entries().each { entry ->
                    def nativeMatch = entry.name =~ '^lib/([^/]+)/[^/]+\\.so$'
                    if (nativeMatch.matches()) packagedAndroidAbis.add(nativeMatch.group(1))
                    if (entry.name ==~ /classes(\d*)?\.dex/) {
                        sawTestDex = true
                        byte[] testDexBytes = testZip.getInputStream(entry).bytes
                        String testDexText = new String(testDexBytes,
                                StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                        if (testDexText.contains(forbiddenProtocol)
                                || testDexText.contains(forbiddenDashed)) {
                            throw new GradleException("Removed transport remains in androidTest DEX: "
                                    + "${apk.name}!${entry.name}")
                        }
                        forbiddenResetTokens.each { removed ->
                            if (testDexText.contains(removed.toLowerCase(Locale.ROOT))) {
                                throw new GradleException(
                                        "Removed settings reset path remains in androidTest DEX: "
                                                + "${apk.name}!${entry.name}")
                            }
                        }
                        forbiddenThirdPartyCoreTokens.each { removed ->
                            if (testDexText.contains(removed.toLowerCase(Locale.ROOT))) {
                                throw new GradleException(
                                        "Removed third-party core source remains in androidTest DEX: "
                                                + "${apk.name}!${entry.name}")
                            }
                        }
                        forbiddenRemovedProviderTokens.each { removed ->
                            if (testDexText.contains(removed)) {
                                throw new GradleException(
                                        "Removed provider remains in androidTest DEX: "
                                                + "${apk.name}!${entry.name}")
                            }
                        }
                        forbiddenSensitiveSubscriptionTokens.each { token ->
                            if (testDexText.contains(token)) {
                                throw new GradleException(
                                        "Plaintext built-in subscription material remains in androidTest DEX: "
                                                + "${apk.name}!${entry.name}")
                            }
                        }
                    }
                }
            } finally {
                testZip.close()
            }
            if (!sawTestDex) {
                throw new GradleException("androidTest APK contains no DEX: ${apk}")
            }
            if (packagedAndroidAbis != supportedAbis as Set) {
                throw new GradleException("androidTest APK ABI set mismatch for ${apk.name}: "
                        + packagedAndroidAbis)
            }
        }
        [file("src/main"), file("src/test"), file("src/androidTest"), file("tests"), pluginTemplateFile,
         file("build.gradle"), proguardFile, file("README.md"),
         file("DEVICE_BETA_CHECKLIST.md")].each { source ->
            if (!source.exists()) return
            def files = source.isDirectory() ? fileTree(source).files : [source] as Set
            files.each { candidate ->
                String lower = candidate.getText("UTF-8").toLowerCase(Locale.ROOT)
                if (lower.contains(forbiddenProtocol) || lower.contains(forbiddenDashed)) {
                    throw new GradleException("Removed transport remains in source: ${candidate}")
                }
                forbiddenResetTokens.each { removed ->
                    if (lower.contains(removed.toLowerCase(Locale.ROOT))) {
                        throw new GradleException(
                                "Removed settings reset path remains in source: ${candidate}")
                    }
                }
                forbiddenThirdPartyCoreTokens.each { removed ->
                    if (lower.contains(removed.toLowerCase(Locale.ROOT))) {
                        throw new GradleException(
                                "Removed third-party core source remains in source: ${candidate}")
                    }
                }
                forbiddenRemovedProviderTokens.each { removed ->
                    if (lower.contains(removed)) {
                        throw new GradleException(
                                "Removed provider remains in source: ${candidate}")
                    }
                }
                forbiddenSensitiveSubscriptionTokens.each { token ->
                    if (lower.contains(token)) {
                        throw new GradleException(
                                "Plaintext built-in subscription material remains in source: ${candidate}")
                    }
                }
            }
        }
        String nativeBridgeSource = file("src/main/cpp/exitfy_bridge.c").getText("UTF-8")
        if (!nativeBridgeSource.contains("RTLD_NOW | RTLD_LOCAL")
                || nativeBridgeSource.contains("RTLD_GLOBAL")) {
            throw new GradleException("JNI core loader must use RTLD_LOCAL only")
        }
        if (!nativeBridgeSource.contains(
                "ANDROID_DLEXT_USE_LIBRARY_FD | ANDROID_DLEXT_FORCE_LOAD")
                || !nativeBridgeSource.contains("fcntl(source_fd, F_DUPFD_CLOEXEC, 0)")) {
            throw new GradleException(
                    "JNI core loader must consume only a duplicated pinned descriptor")
        }
        if ((nativeBridgeSource =~ /(^|[^A-Za-z0-9_])dlopen\s*\(/).find()) {
            throw new GradleException("JNI core loader must not fall back to path dlopen")
        }
        String nativeRuntimeSource = file(
                "src/main/java/com/extera/plugins/exitfy/NativeCoreRuntime.java")
                .getText("UTF-8")
        String coreHandleSource = file(
                "src/main/java/com/extera/plugins/exitfy/CoreFileHandle.java")
                .getText("UTF-8")
        String coreUpdaterSource = file(
                "src/main/java/com/extera/plugins/exitfy/CoreUpdater.java")
                .getText("UTF-8")
        if (!nativeRuntimeSource.contains("preparePinnedLoadTarget()")
                || !coreHandleSource.contains("OsConstants.O_NOFOLLOW")
                || !coreUpdaterSource.contains("handle.verify(abi, target.digest)")) {
            throw new GradleException(
                    "core digest/ELF/native-load descriptor attestation is incomplete")
        }
        providers.exec {
            commandLine "python3", "-c",
                    "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), filename=sys.argv[1], feature_version=(3,11))",
                    outputPlugin.absolutePath
        }.result.get().assertNormalExitValue()
        logger.lifecycle("Verified ${outputPlugin}: DEX + ${supportedAbis.size()} JNI ABIs")
    }
}
