// AGP can leave native model directories from an older ABI matrix when its
// configuration hash changes. A clean arm64-only build must not retain those
// generated Android-ABI caches beside the current arm64-only model.
tasks.named("clean").configure {
    delete file(".cxx")
    delete file("__pycache__"), file("tests/__pycache__"), file("tools/__pycache__")
    delete fileTree(projectDir).matching {
        include "java_pid*.hprof", "**/__pycache__/**"
    }
    doLast {
        // Gradle/Ant default excludes hide .DS_Store from a normal fileTree.
        ant.delete(quiet: true) {
            fileset(dir: projectDir, defaultexcludes: false) {
                include(name: "**/.DS_Store")
            }
        }
    }
}

def resolveBuildToolsExe = { String exeName ->
    def btDir = file("${androidSdkDir}/build-tools")
    if (!btDir.exists()) {
        throw new GradleException("Android build-tools not found in SDK: ${btDir}")
    }
    def candidates = btDir.listFiles().findAll { it.isDirectory() && new File(it, exeName).exists() }
    if (!candidates) {
        throw new GradleException("${exeName} not found in build-tools")
    }
    candidates.sort { a, b ->
        def av = a.name.tokenize('.').collect { it.isInteger() ? it as int : 0 }
        def bv = b.name.tokenize('.').collect { it.isInteger() ? it as int : 0 }
        for (int i = 0; i < Math.max(av.size(), bv.size()); i++) {
            int ai = i < av.size() ? av[i] : 0
            int bi = i < bv.size() ? bv[i] : 0
            if (ai != bi) return ai <=> bi
        }
        0
    }
    new File(candidates.last(), exeName).absolutePath
}

def resolveNdkTool = { String toolName ->
    String executable = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ?
            "${toolName}.exe" : toolName
    File prebuiltRoot = new File(androidNdkDir, "toolchains/llvm/prebuilt")
    if (!prebuiltRoot.isDirectory()) {
        throw new GradleException("Android NDK ${ndkRevision} not found: ${androidNdkDir}")
    }
    def candidates = prebuiltRoot.listFiles()
            .findAll { it.isDirectory() }
            .collect { new File(it, "bin/${executable}") }
            .findAll { it.isFile() }
            .sort { it.absolutePath }
    if (!candidates) {
        throw new GradleException("${toolName} not found in Android NDK: ${androidNdkDir}")
    }
    candidates.first().absolutePath
}

def resolveJadx = {
    boolean windows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
    String executable = windows ? "jadx.bat" : "jadx"
    List<File> candidates = []
    String configured = findProperty("jadxPath") ?: System.getenv("JADX")
    if (configured) candidates.add(file(configured))
    String jadxHome = System.getenv("JADX_HOME")
    if (jadxHome) candidates.add(new File(jadxHome, "bin/${executable}"))
    String path = System.getenv("PATH")
    if (path) {
        path.split(java.util.regex.Pattern.quote(File.pathSeparator)).each { entry ->
            if (entry) candidates.add(new File(entry, executable))
        }
    }
    if (!windows) {
        candidates.add(file("/opt/homebrew/bin/jadx"))
        candidates.add(file("/usr/local/bin/jadx"))
    }
    File resolved = candidates.find { it.isFile() }
    if (resolved == null) {
        throw new GradleException(
                "jadx is required for artifact audit; set -PjadxPath, JADX, JADX_HOME, or PATH")
    }
    resolved.absolutePath
}

def captureCommand = { List<String> command ->
    Process process
    ByteArrayOutputStream output = new ByteArrayOutputStream()
    try {
        process = new ProcessBuilder(command)
                .redirectErrorStream(true)
                .start()
        InputStream stream = process.inputStream
        try {
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) >= 0) {
                if (count > 0) output.write(buffer, 0, count)
            }
        } finally {
            stream.close()
        }
        int exitCode = process.waitFor()
        String captured = output.toString(StandardCharsets.UTF_8.name())
        if (exitCode != 0) {
            throw new GradleException(
                    "Command failed (${exitCode}): ${command.join(' ')}\n${captured}")
        }
        captured
    } catch (InterruptedException interrupted) {
        if (process != null) process.destroyForcibly()
        Thread.currentThread().interrupt()
        throw new GradleException("Command interrupted: ${command.join(' ')}", interrupted)
    }
}

def deflate = { byte[] input ->
    ByteArrayOutputStream compressed = new ByteArrayOutputStream()
    Deflater deflater = new Deflater(9)
    DeflaterOutputStream stream = new DeflaterOutputStream(compressed, deflater)
    stream.write(input)
    stream.close()
    deflater.end()
    compressed.toByteArray()
}

def inflate = { byte[] input ->
    InflaterInputStream stream = new InflaterInputStream(new ByteArrayInputStream(input))
    ByteArrayOutputStream output = new ByteArrayOutputStream()
    byte[] buffer = new byte[8192]
    int count
    while ((count = stream.read(buffer)) >= 0) {
        if (count > 0) output.write(buffer, 0, count)
    }
    stream.close()
    output.toByteArray()
}

def sha256 = { byte[] input ->
    MessageDigest.getInstance("SHA-256").digest(input).encodeHex().toString()
}

def privateProviderUrls = {
    if (!providerPrivateFile.isFile()) return []
    if (providerPrivateFile.length() > 32 * 1024) {
        throw new GradleException("providers.private.json exceeds 32 KiB")
    }
    Object parsed = new JsonSlurper().parse(providerPrivateFile)
    if (!(parsed instanceof Map) || parsed.schema != 1 || !(parsed.providers instanceof Map)) {
        throw new GradleException("providers.private.json contract is invalid")
    }
    Map providers = (Map) parsed.providers
    if (!(providers.keySet() as Set).every { it in providerSlotIds }) {
        throw new GradleException("providers.private.json contains an unknown provider")
    }
    providerSlotIds.collect { providers[it] }.findAll { it instanceof String }
}

def providerSecretNeedles = { Collection<String> urls ->
    Set<String> needles = new LinkedHashSet<>()
    urls.each { value ->
        String lower = value.toLowerCase(Locale.ROOT)
        if (!lower.isEmpty()) needles.add(lower)
        try {
            URI parsed = new URI(value)
            if (parsed.host != null && !parsed.host.isEmpty()) {
                needles.add(parsed.host.toLowerCase(Locale.ROOT))
            }
            String material = [parsed.rawPath, parsed.rawQuery]
                    .findAll { it != null }.join("&")
            material.split("[/=?&#]").each { part ->
                String token = part.toLowerCase(Locale.ROOT)
                if (token.length() >= 12) needles.add(token)
            }
        } catch (Exception error) {
            throw new GradleException("Private provider URL contract is invalid", error)
        }
    }
    needles
}

def assertNoProviderPlaintext = { Collection<File> candidates,
                                  Collection<String> needles,
                                  String surface ->
    if (needles.isEmpty()) return
    candidates.each { candidate ->
        if (!candidate.isFile()) return
        String lower = candidate.getText("UTF-8").toLowerCase(Locale.ROOT)
        needles.each { needle ->
            if (lower.contains(needle)) {
                throw new GradleException(
                        "Plaintext private provider material remains in ${surface}: ${candidate}")
            }
        }
    }
}

def payloadFromBlock = { String text, String beginMarker, String endMarker ->
    int begin = text.indexOf(beginMarker)
    int end = text.indexOf(endMarker)
    if (begin < 0 || end < 0 || end <= begin) {
        throw new GradleException("Missing payload markers ${beginMarker}/${endMarker}")
    }
    String block = text.substring(begin + beginMarker.length(), end)
    block.readLines()
            .findAll { it.trim().startsWith("#") }
            .collect { it.trim().substring(1).trim() }
            .join("")
}

def replacePayloadBlock = { String text, String beginMarker, String endMarker, String payload ->
    int begin = text.indexOf(beginMarker)
    int end = text.indexOf(endMarker)
    if (begin < 0 || end < 0 || end <= begin) {
        throw new GradleException("Missing payload markers ${beginMarker}/${endMarker}")
    }
    String lineSep = System.lineSeparator()
    StringBuilder block = new StringBuilder(beginMarker).append(lineSep)
    List<String> forbiddenPayloadTokens = [
            ["tg", "ws"].join(""),
            ["tg", "-ws"].join(""),
    ]
    int cursor = 0
    while (cursor < payload.length()) {
        int take = Math.min(120, payload.length() - cursor)
        String candidate = payload.substring(cursor, cursor + take)
        String lower = candidate.toLowerCase(Locale.ROOT)
        int safeTake = take
        forbiddenPayloadTokens.each { token ->
            int found = lower.indexOf(token)
            if (found >= 0) safeTake = Math.min(safeTake, Math.max(1, found + 2))
        }
        block.append("# ").append(payload, cursor, cursor + safeTake).append(lineSep)
        cursor += safeTake
    }
    block.append(endMarker)
    text.substring(0, begin) + block + text.substring(end + endMarker.length())
}

def readNativeBundleFromAar = { File aarFile ->
    Map<String, Object> libs = new LinkedHashMap<>()
    ZipFile zip = new ZipFile(aarFile)
    try {
        Set<String> expectedNativeEntries = supportedAbis.collect {
            "jni/${it}/libexitfy_bridge.so"
        } as Set
        Set<String> actualNativeEntries = zip.entries().findAll { entry ->
            entry.name.startsWith("jni/") && entry.name.endsWith(".so")
        }.collect { it.name } as Set
        if (actualNativeEntries != expectedNativeEntries) {
            throw new GradleException("Plugin AAR native set mismatch. Expected "
                    + expectedNativeEntries + ", got " + actualNativeEntries)
        }
        supportedAbis.each { abi ->
            String name = "jni/${abi}/libexitfy_bridge.so"
            def entry = zip.getEntry(name)
            if (entry == null) {
                throw new GradleException("Native bridge missing from AAR: ${name}")
            }
            byte[] bytes = zip.getInputStream(entry).bytes
            libs[abi] = [
                    size  : bytes.length,
                    sha256: sha256(bytes),
                    data  : bytes.encodeBase64().toString(),
            ]
        }
    } finally {
        zip.close()
    }
    byte[] json = JsonOutput.toJson([format: 1, version: pluginVersion, libs: libs])
            .getBytes(StandardCharsets.UTF_8)
    deflate(json).encodeBase64().toString()
}

def lexJavaContract = { String source ->
    List<String> tokens = new ArrayList<>()
    int index = 0
    while (index < source.length()) {
        char value = source.charAt(index)
        if (Character.isWhitespace(value)) {
            index++
            continue
        }
        if (value == '/' && index + 1 < source.length()) {
            char next = source.charAt(index + 1)
            if (next == '/') {
                index += 2
                while (index < source.length()
                        && source.charAt(index) != '\n'
                        && source.charAt(index) != '\r') {
                    index++
                }
                continue
            }
            if (next == '*') {
                int end = source.indexOf('*/', index + 2)
                if (end < 0) throw new GradleException("Unterminated Java block comment")
                index = end + 2
                continue
            }
        }
        if (value == '"' || value == '\'') {
            char quote = value
            StringBuilder literal = new StringBuilder()
            boolean closed = false
            index++
            while (index < source.length()) {
                char part = source.charAt(index++)
                if (part == '\\') {
                    if (index >= source.length()) {
                        throw new GradleException("Unterminated Java escape sequence")
                    }
                    literal.append(part).append(source.charAt(index++))
                } else if (part == quote) {
                    closed = true
                    break
                } else {
                    if (part == '\n' || part == '\r') {
                        throw new GradleException("Unterminated Java literal")
                    }
                    literal.append(part)
                }
            }
            if (!closed) throw new GradleException("Unterminated Java literal")
            tokens.add((quote == '"' ? "STRING:" : "CHAR:") + literal)
            continue
        }
        if (Character.isJavaIdentifierStart(value)) {
            int begin = index++
            while (index < source.length()
                    && Character.isJavaIdentifierPart(source.charAt(index))) {
                index++
            }
            tokens.add(source.substring(begin, index))
            continue
        }
        if (Character.isDigit(value)) {
            int begin = index++
            while (index < source.length() && Character.isDigit(source.charAt(index))) index++
            tokens.add(source.substring(begin, index))
            continue
        }
        if (index + 1 < source.length()) {
            String pair = source.substring(index, index + 2)
            if (["!=", "==", "<=", ">=", "&&", "||", "++", "--",
                 "+=", "-=", "*=", "/=", "%="].contains(pair)) {
                tokens.add(pair)
                index += 2
                continue
            }
        }
        tokens.add(String.valueOf(value))
        index++
    }
    tokens
}

def countTokenSequence = { List<String> tokens, List<String> expected ->
    int matches = 0
    for (int start = 0; start + expected.size() <= tokens.size(); start++) {
        boolean same = true
        for (int offset = 0; offset < expected.size(); offset++) {
            if (tokens[start + offset] != expected[offset]) {
                same = false
                break
            }
        }
        if (same) matches++
    }
    matches
}

def countTokenPattern = { List<String> tokens, List<Object> pattern ->
    int matches = 0
    for (int start = 0; start + pattern.size() <= tokens.size(); start++) {
        boolean same = true
        for (int offset = 0; offset < pattern.size(); offset++) {
            Object expected = pattern[offset]
            if (expected != null && tokens[start + offset] != expected) {
                same = false
                break
            }
        }
        if (same) matches++
    }
    matches
}

def validateBootstrapContract = { String source, String expectedVersion,
                                  int expectedSchema, String expectedPluginId ->
    // JLS 3.3 translates raw Unicode escapes before comments, strings, and
    // ordinary tokenization. This deliberately conservative source contract
    // forbids every backslash + lowercase-u introducer, including multiple-u
    // forms, so the small lexer below can never see a different program than
    // javac. BootstrapConfig has no legitimate need for raw Unicode escapes.
    for (int index = 0; index + 1 < source.length(); index++) {
        if (source.charAt(index) == (char) 0x5c && source.charAt(index + 1) == 'u') {
            throw new GradleException(
                    "BootstrapConfig raw Java Unicode escapes are forbidden")
        }
    }
    List<String> tokens = lexJavaContract(source)
    String expectedVersionToken = "STRING:${expectedVersion}"
    String expectedPluginIdToken = "STRING:${expectedPluginId}"
    Map<String, List<String>> required = [
            "plugin version declaration": [
                    "private", "static", "final", "String", "PLUGIN_VERSION", "=",
                    expectedVersionToken, ";"],
            "settings schema declaration": [
                    "private", "static", "final", "int", "SETTINGS_SCHEMA", "=",
                    String.valueOf(expectedSchema), ";"],
            "plugin id default": [
                    "String", "pluginId", "=", "value", ".", "optString", "(",
                    "STRING:pluginId", ",", expectedPluginIdToken, ")", ";"],
            "plugin version validation": [
                    "if", "(", "!", "PLUGIN_VERSION", ".", "equals", "(",
                    "pluginVersion", ")", ")"],
            "settings schema validation": [
                    "if", "(", "settingsSchema", "!=", "SETTINGS_SCHEMA", ")"],
            "plugin id validation": [
                    "if", "(", "!", expectedPluginIdToken, ".", "equals", "(",
                    "pluginId", ")", ")"],
    ]
    required.each { label, sequence ->
        if (countTokenSequence(tokens, sequence) != 1) {
            throw new GradleException("BootstrapConfig ${label} is out of sync")
        }
    }
    Map<String, List<Object>> uniqueShapes = [
            "plugin version declaration shape": [
                    "private", "static", "final", "String", "PLUGIN_VERSION", "=", null, ";"],
            "settings schema declaration shape": [
                    "private", "static", "final", "int", "SETTINGS_SCHEMA", "=", null, ";"],
            "plugin id default shape": [
                    "String", "pluginId", "=", "value", ".", "optString", "(",
                    "STRING:pluginId", ",", null, ")", ";"],
            "plugin version comparison shape": [
                    "PLUGIN_VERSION", ".", "equals", "(", null, ")"],
            "settings schema comparison shape": [
                    "settingsSchema", null, "SETTINGS_SCHEMA"],
            "plugin id comparison shape": [
                    null, ".", "equals", "(", "pluginId", ")"],
    ]
    uniqueShapes.each { label, pattern ->
        if (countTokenPattern(tokens, pattern) != 1) {
            throw new GradleException("BootstrapConfig ${label} is ambiguous")
        }
    }
}

def expectBootstrapContractFailure = { String label, String source,
                                       String expectedVersion, int expectedSchema,
                                       String expectedPluginId ->
    boolean rejected = false
    try {
        validateBootstrapContract(source, expectedVersion, expectedSchema, expectedPluginId)
    } catch (GradleException expected) {
        rejected = true
    }
    if (!rejected) {
        throw new GradleException("Bootstrap contract regression was not rejected: ${label}")
    }
}

def generateProviderCatalogTask = tasks.register("generateProviderCatalog") {
    group = "build setup"
    description = "Regenerates the encrypted built-in provider catalog from providers.private.json"
    inputs.file(providerGeneratorFile)
    if (providerPrivateFile.exists()) inputs.file(providerPrivateFile)
    outputs.files(providerCatalogFiles)

    doLast {
        File ignoreFile = file(".gitignore")
        boolean privateFileIgnored = ignoreFile.isFile() && ignoreFile.readLines("UTF-8")
                .collect { it.trim() }.any { it == "providers.private.json"
                        || it == "/providers.private.json" }
        if (!privateFileIgnored) {
            throw new GradleException("providers.private.json must be ignored by git")
        }
        if (!providerGeneratorFile.isFile()) {
            throw new GradleException("Provider catalog generator is missing")
        }
        if (providerPrivateFile.isFile()) {
            providers.exec {
                environment "PYTHONDONTWRITEBYTECODE", "1"
                commandLine "python3", providerGeneratorFile.absolutePath,
                        "--input", providerPrivateFile.absolutePath,
                        "--output-dir", file("src/main/java/com/extera/plugins/exitfy").absolutePath
            }.result.get().assertNormalExitValue()
        }
        providerCatalogFiles.each { generated ->
            if (!generated.isFile()) {
                throw new GradleException(
                        "Encrypted provider catalog is missing; create providers.private.json "
                                + "from providers.private.example.json and run generateProviderCatalog")
            }
        }
    }
}

tasks.register("prepareHostClasses") {
    group = "build setup"
    description = "Builds full exteraGram host classes when the referenced host contracts change"
    inputs.files(hostContractSources)
    outputs.file(hostClassesJar)

    doLast {
        File wrapperJar = new File(telegramSourceDir, "gradle/wrapper/gradle-wrapper.jar")
        if (!wrapperJar.exists()) {
            throw new GradleException("Gradle wrapper not found in Telegram source: ${telegramSourceDir}")
        }
        providers.exec {
            workingDir telegramSourceDir
            commandLine "java", "-classpath", wrapperJar.absolutePath,
                    "org.gradle.wrapper.GradleWrapperMain",
                    "-PAPP_PACKAGE=${hostApplicationId}",
                    ":TMessagesProj:${hostBundleTask}"
        }.result.get().assertNormalExitValue()
        if (!hostClassesJar.exists()) {
            throw new GradleException("Host classes jar not found after build: ${hostClassesJar}")
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn tasks.named("prepareHostClasses")
}

tasks.configureEach { task ->
    if (task.name.startsWith("compile") && task.name.endsWith("JavaWithJavac")) {
        task.dependsOn generateProviderCatalogTask
    }
    if (task.name.startsWith("extract") && task.name.endsWith("Annotations")) {
        task.dependsOn generateProviderCatalogTask
    }
}

tasks.register("bootstrapContractRegression") {
    group = "verification"
    description = "Proves stale bootstrap version, schema, and plugin ID contracts fail closed"
    inputs.file(bootstrapConfigFile)
    doLast {
        String source = bootstrapConfigFile.getText("UTF-8")
        validateBootstrapContract(source, pluginVersion, settingsSchema, pluginId)

        String versionDeclaration =
                "private static final String PLUGIN_VERSION = \"${pluginVersion}\";"
        String schemaDeclaration =
                "private static final int SETTINGS_SCHEMA = ${settingsSchema};"
        String idDefault =
                "String pluginId = value.optString(\"pluginId\", \"${pluginId}\");"
        String idValidation = "if (!\"${pluginId}\".equals(pluginId))"
        String versionValidation = "if (!PLUGIN_VERSION.equals(pluginVersion))"
        String schemaValidation = "if (settingsSchema != SETTINGS_SCHEMA)"
        def withStringDecoy = { String base, String decoy ->
            int classEnd = base.lastIndexOf('}')
            if (classEnd < 0) throw new GradleException("Bootstrap fixture has no class end")
            String escaped = decoy.replace('\\', '\\\\').replace('"', '\\"')
            return base.substring(0, classEnd) +
                    "\n    private static final String BOOTSTRAP_CONTRACT_DECOY = \"" +
                    escaped + "\";\n" + base.substring(classEnd)
        }

        String versionDeclarationDecoy = source.replace(versionDeclaration,
                "private static final String PLUGIN_VERSION = \"${pluginVersion}-stale\";") +
                "\n// ${versionDeclaration}\n"
        expectBootstrapContractFailure("line-comment version declaration decoy",
                versionDeclarationDecoy,
                pluginVersion, settingsSchema, pluginId)
        String schemaDeclarationDecoy = source.replace(schemaDeclaration,
                "private static final int SETTINGS_SCHEMA = ${settingsSchema + 1};") +
                "\n/* ${schemaDeclaration} */\n"
        expectBootstrapContractFailure("block-comment schema declaration decoy",
                schemaDeclarationDecoy,
                pluginVersion, settingsSchema, pluginId)
        expectBootstrapContractFailure("string-literal plugin id default decoy",
                withStringDecoy(source.replace(idDefault,
                        "String pluginId = value.optString(\"pluginId\", \"exitfy\");"),
                        idDefault),
                pluginVersion, settingsSchema, pluginId)
        expectBootstrapContractFailure("string-literal plugin id validation decoy",
                withStringDecoy(source.replace(
                        idValidation, "if (!\"exitfy\".equals(pluginId))"), idValidation),
                pluginVersion, settingsSchema, pluginId)
        String versionValidationDecoy = source.replace(versionValidation,
                "if (PLUGIN_VERSION.equals(pluginVersion))") +
                "\n// ${versionValidation}\n"
        expectBootstrapContractFailure("line-comment version validation decoy",
                versionValidationDecoy,
                pluginVersion, settingsSchema, pluginId)
        String schemaValidationDecoy = source.replace(schemaValidation,
                "if (settingsSchema == SETTINGS_SCHEMA)") +
                "\n/* ${schemaValidation} */\n"
        expectBootstrapContractFailure("block-comment schema validation decoy",
                schemaValidationDecoy,
                pluginVersion, settingsSchema, pluginId)

        // Build the raw introducers from character codes: spelling them in
        // this Gradle source would itself be subject to an implementation's
        // Unicode-escape preprocessing. Each fixture combines a stale real
        // contract with a decoy whose lexical role changes under JLS 3.3.
        String slash = String.valueOf((char) 0x5c)
        String unicode = slash + "u"
        String unicodeSlash = unicode + "002f"
        String unicodeStar = unicode + "002a"
        String unicodeNewline = unicode + "000a"
        String unicodeQuote = unicode + "0022"
        String multipleUnicodeSlash = slash + "uuuu002f"

        String staleUnicodeVersion = source.replace(versionDeclaration,
                "private static final String PLUGIN_VERSION = \"${pluginVersion}-stale\";")
        if (staleUnicodeVersion == source) {
            throw new GradleException("Unicode version regression did not mutate actual code")
        }
        expectBootstrapContractFailure("Unicode-formed line comment",
                staleUnicodeVersion + "\n" + unicodeSlash + unicodeSlash + " "
                        + versionDeclaration + "\n",
                pluginVersion, settingsSchema, pluginId)

        String staleUnicodeSchema = source.replace(schemaDeclaration,
                "private static final int SETTINGS_SCHEMA = ${settingsSchema + 1};")
        if (staleUnicodeSchema == source) {
            throw new GradleException("Unicode schema regression did not mutate actual code")
        }
        expectBootstrapContractFailure("Unicode-formed block comment",
                staleUnicodeSchema + "\n" + unicodeSlash + unicodeStar + " "
                        + schemaDeclaration + " " + unicodeStar + unicodeSlash + "\n",
                pluginVersion, settingsSchema, pluginId)

        String staleUnicodeVersionCheck = source.replace(versionValidation,
                "if (PLUGIN_VERSION.equals(pluginVersion))")
        if (staleUnicodeVersionCheck == source) {
            throw new GradleException("Unicode check regression did not mutate actual code")
        }
        expectBootstrapContractFailure("Unicode-formed newline",
                staleUnicodeVersionCheck + "\n// hidden" + unicodeNewline
                        + versionValidation + "\n",
                pluginVersion, settingsSchema, pluginId)

        String staleUnicodeIdCheck = source.replace(
                idValidation, "if (!\"exitfy\".equals(pluginId))")
        if (staleUnicodeIdCheck == source) {
            throw new GradleException("Unicode ID regression did not mutate actual code")
        }
        expectBootstrapContractFailure("Unicode-formed quote",
                staleUnicodeIdCheck + "\n" + unicodeQuote + idValidation + unicodeQuote + "\n",
                pluginVersion, settingsSchema, pluginId)
        expectBootstrapContractFailure("multiple-u Unicode introducer",
                staleUnicodeVersionCheck + "\n" + multipleUnicodeSlash
                        + multipleUnicodeSlash + " " + versionValidation + "\n",
                pluginVersion, settingsSchema, pluginId)

        String betaNineteen = "4.0.0-beta.19"
        String betaNineteenDeclaration =
                "private static final String PLUGIN_VERSION = \"${betaNineteen}\";"
        String betaNineteenSource = source.replace(versionDeclaration, betaNineteenDeclaration)
        validateBootstrapContract(betaNineteenSource, betaNineteen, settingsSchema, pluginId)
        expectBootstrapContractFailure("beta.19 metadata with beta.18 bootstrap",
                betaNineteenSource.replace(betaNineteenDeclaration,
                        "private static final String PLUGIN_VERSION = \"4.0.0-beta.18\";"),
                betaNineteen, settingsSchema, pluginId)
    }
}

tasks.register("validateEmbeddedDexConfig") {
    group = "verification"
    dependsOn tasks.named("bootstrapContractRegression"), generateProviderCatalogTask
    doLast {
        String pluginText = pluginTemplateFile.getText("UTF-8")
        String proguardText = proguardFile.getText("UTF-8")
        String buildScriptText = file("build.gradle").getText("UTF-8")
        String settingsScriptText = file("settings.gradle").getText("UTF-8")
        String readmeText = file("README.md").getText("UTF-8")
        String deviceChecklistText = file("DEVICE_BETA_CHECKLIST.md")
                .getText("UTF-8")
        String bootstrapText = bootstrapConfigFile.getText("UTF-8")
        String bridgeText = file("src/main/java/com/extera/plugins/exitfy/ExitFyBridge.java")
                .getText("UTF-8")
        String runtimeText = file("src/main/java/com/extera/plugins/exitfy/RuntimeCoordinator.java")
                .getText("UTF-8")
        String directSettingsHookText = file(
                "src/main/java/com/extera/plugins/exitfy/DirectSettingsHook.java")
                .getText("UTF-8")
        String httpText = file("src/main/java/com/extera/plugins/exitfy/LimitedHttpClient.java")
                .getText("UTF-8")
        Map<String, String> required = [
                "plugin id"          : "__id__ = \"${pluginId}\"",
                "plugin version"     : "__version__ = \"${pluginVersion}\"",
                "plugin author"      : "__author__ = \"${pluginAuthor}\"",
                "plugin icon"        : "__icon__ = \"${pluginIcon}\"",
                "minimum app"        : "__app_version__ = \">=12.5.1\"",
                "minimum sdk"        : "__sdk_version__ = \">=1.4.3.3\"",
                "entry class"        : "ENTRY_CLASS = \"${dexEntryClass}\"",
                "DEX keeper prefix"  : "DEX_KEEPER_PREFIX = \"exitfy-dex-keeper:exitFy_v2:\"",
                "DEX keeper reuse"   : "retained = self._find_retained_dex()",
                "settings schema"    : "SETTINGS_SCHEMA = ${settingsSchema}",
                "settings registry placeholder": "from ui.settings import Text",
                "DEX begin marker"   : dexBeginMarker,
                "DEX end marker"     : dexEndMarker,
                "native begin marker": nativeBeginMarker,
                "native end marker"  : nativeEndMarker,
                "private data root"  : "getDir(\"exitFy_v2\", 0)",
                "stable bridge path" : "os.path.join(root, \"bridge\", abi)",
                "single Android ABI" : "SUPPORTED_ABIS = (\"arm64-v8a\",)",
                "API 29 gate"        : "if int(BuildVersion.SDK_INT) < ${minAndroidApi}:",
                "64-bit gate"        : "Process.is64Bit()",
                "primary ABI gate"   : "value = str(abis[0])",
        ]
        required.each { label, value ->
            if (!pluginText.contains(value)) throw new GradleException("${label} is out of sync")
        }
        if (!readmeText.contains("# exitFy ${pluginVersion}")
                || !readmeText.contains("settings schema is ${settingsSchema}")
                || !deviceChecklistText.contains("# exitFy ${pluginVersion} device checklist")
                || !deviceChecklistText.contains(
                "version `${pluginVersion}`, schema ${settingsSchema}")) {
            throw new GradleException("Release documentation version/schema is out of sync")
        }
        validateBootstrapContract(bootstrapText, pluginVersion, settingsSchema, pluginId)
        if (pluginText.contains("__min_version__")) {
            throw new GradleException("Legacy __min_version__ metadata is forbidden")
        }
        if (pluginText.contains("CPU_ABI") || pluginText.contains("SUPPORTED_32_BIT_ABIS")
                || pluginText.contains("SUPPORTED_64_BIT_ABIS")) {
            throw new GradleException("Legacy or secondary ABI fallback remains in loader")
        }
        int nativeExtractStart = pluginText.indexOf("def _extract_native_bridge():")
        int nativePlatformGate = pluginText.indexOf(
                "abi = _require_supported_platform()", nativeExtractStart)
        int nativePayloadRead = pluginText.indexOf(
                "_read_payload(NATIVE_BEGIN, NATIVE_END)", nativeExtractStart)
        int nativeRuntimeWrite = pluginText.indexOf(
                "getDir(\"exitFy_v2\", 0)", nativeExtractStart)
        int dexPrepareStart = pluginText.indexOf("    def prepare(self):")
        int dexPlatformGate = pluginText.indexOf(
                "_require_supported_platform()", dexPrepareStart)
        int dexPayloadRead = pluginText.indexOf(
                "_read_payload(DEX_BEGIN, DEX_END)", dexPrepareStart)
        if (nativeExtractStart < 0 || nativePlatformGate < nativeExtractStart
                || nativePayloadRead < nativePlatformGate
                || nativeRuntimeWrite < nativePayloadRead
                || dexPrepareStart < 0 || dexPlatformGate < dexPrepareStart
                || dexPayloadRead < dexPlatformGate) {
            throw new GradleException(
                    "API/ABI gate must precede all DEX/JNI reads and runtime writes")
        }
        forbiddenResetTokens.each { removed ->
            if (pluginText.contains(removed)) {
                throw new GradleException("Removed settings reset path remains in template: ${removed}")
            }
        }
        [".edit()", "putString(", "putBoolean(", "putInt("].each { mutation ->
            if (pluginText.contains(mutation)) {
                throw new GradleException(
                        "Template must not write host preferences: ${mutation}")
            }
        }
        forbiddenThirdPartyCoreTokens.each { removed ->
            if (pluginText.toLowerCase(Locale.ROOT).contains(removed.toLowerCase(Locale.ROOT))) {
                throw new GradleException("Removed third-party core source remains in template")
            }
        }
        forbiddenRemovedProviderTokens.each { removed ->
            if (pluginText.toLowerCase(Locale.ROOT).contains(removed)) {
                throw new GradleException("Removed provider remains in template")
            }
        }
        Collection<File> providerSourceFiles = ([pluginTemplateFile] + fileTree("src").matching {
            include "**/*.java"
            include "**/*.c"
            include "**/*.xml"
        }.files) as Collection<File>
        providerSourceFiles.each { candidate ->
            String lower = candidate.getText("UTF-8").toLowerCase(Locale.ROOT)
            forbiddenSensitiveSubscriptionTokens.each { token ->
                if (lower.contains(token)) {
                    throw new GradleException(
                            "Plaintext built-in subscription material remains in ${candidate}")
                }
            }
        }
        assertNoProviderPlaintext(providerSourceFiles,
                providerSecretNeedles(privateProviderUrls()), "plugin sources")
        forbiddenDiagnosticsTokens.each { removed ->
            if (pluginText.toLowerCase(Locale.ROOT).contains(removed)) {
                throw new GradleException("Removed diagnostics surface remains in template: ${removed}")
            }
        }
        Collection<File> nodeSelectionSources = ([pluginTemplateFile, file("README.md"),
                file("DEVICE_BETA_CHECKLIST.md")] + fileTree("src").matching {
            include "**/*.java"
            include "**/*.c"
            include "**/*.xml"
        }.files + fileTree("tests").matching { include "**/*.py" }.files) as Collection<File>
        nodeSelectionSources.each { candidate ->
            String lower = candidate.getText("UTF-8").toLowerCase(Locale.ROOT)
            forbiddenNodeSelectionTokens.each { removed ->
                if (lower.contains(removed.toLowerCase(Locale.ROOT))) {
                    throw new GradleException(
                            "Removed node-selection feature remains in ${candidate.name}")
                }
            }
        }
        fileTree("src/main/java").matching { include "**/*.java" }.files.each { javaFile ->
            String sourceText = javaFile.getText("UTF-8").toLowerCase(Locale.ROOT)
            forbiddenDiagnosticsTokens.each { removed ->
                if (sourceText.contains(removed)) {
                    throw new GradleException(
                            "Removed diagnostics runtime remains in ${javaFile.name}: ${removed}")
                }
            }
        }
        int settingsStart = pluginText.indexOf("    def create_settings(self):")
        int settingsEnd = pluginText.indexOf("\n    def _register_menu", settingsStart)
        if (settingsStart < 0 || settingsEnd < settingsStart) {
            throw new GradleException("Plugin settings registry placeholder is missing")
        }
        String settingsBody = pluginText.substring(settingsStart, settingsEnd)
        // The registry may point at the native screen, but it must never hold
        // a setting: a second copy of one setting is what this forbids. Only
        // Text rows are allowed, and none of them may carry a value.
        if (!settingsBody.contains('Text(text="@exteraPluginsSup"')
                || settingsBody.contains("on_change")
                || (settingsBody =~ /(?m)^\s{12}([A-Z][A-Za-z]*)\(/).collect { it[1] }
                        .any { it != "Text" }) {
            throw new GradleException("Settings registry must only navigate, never hold state")
        }
        if (!pluginText.contains('self.set_setting("core_policy", "auto"')
                || pluginText.contains('"core_policy": self._core_policy_value()')
                || pluginText.contains("def _core_policy_value(self):")) {
