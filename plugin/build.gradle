    namespace = 'com.extera.plugins.exitfy'
    compileSdk = compileSdkApi
    ndkVersion = ndkRevision

    defaultConfig {
        minSdk = minAndroidApi
        ndk {
            abiFilters.addAll(supportedAbis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DEXITFY_BUILD_FAKE_CORES=ON"
                }
            }
        }
        release {
            minifyEnabled = false
            externalNativeBuild {
                cmake {
                    arguments "-DEXITFY_BUILD_FAKE_CORES=OFF"
                }
            }
        }
        plugin {
            initWith release
            matchingFallbacks = ['debug']
            minifyEnabled = true
            // The stock optimized rules globally enable access relaxation,
            // which would expand the reflected bridge ABI. This DEX has no
            // Android component entry points, so use the plugin's scoped rules.
            proguardFiles proguardFile
            externalNativeBuild {
                cmake {
                    arguments "-DEXITFY_BUILD_FAKE_CORES=OFF"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

